name: GitHub Pages Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  migrate:
    name: migrate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check for migration changes
        id: check
        run: |
          # Defaults to "changed" (run migrations) unless we can positively
          # confirm this push touched no migration files -- a false positive
          # here just costs a few redundant seconds (supabase db push is a
          # no-op when nothing's new); a false negative would silently skip a
          # real schema change, which is far worse.
          if git rev-parse HEAD^ >/dev/null 2>&1 && git diff --quiet HEAD^ HEAD -- supabase/migrations/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.check.outputs.changed == 'true'
        # Pinned to 2.111.0: v2.112.0 regressed `link` with a schema-validation
        # error on the api-keys `inserted_at` timestamp, breaking every CI
        # pipeline that runs `link` + `db push` (supabase/cli#6115). Bump this
        # once that's fixed upstream.
        run: npm install -g supabase@2.111.0

      - name: Link Supabase project
        if: steps.check.outputs.changed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link \
            --project-ref ${{ vars.SUPABASE_PROJECT_ID }} \
            --password ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Apply new migrations
        if: steps.check.outputs.changed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push

  build:
    name: build
    needs: migrate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL }}
          VITE_STRIPE_PRICE_STARTER_MONTHLY: ${{ vars.VITE_STRIPE_PRICE_STARTER_MONTHLY }}
          VITE_STRIPE_PRICE_STARTER_ANNUAL: ${{ vars.VITE_STRIPE_PRICE_STARTER_ANNUAL }}
          VITE_STRIPE_PRICE_GROWTH_MONTHLY: ${{ vars.VITE_STRIPE_PRICE_GROWTH_MONTHLY }}
          VITE_STRIPE_PRICE_GROWTH_ANNUAL: ${{ vars.VITE_STRIPE_PRICE_GROWTH_ANNUAL }}
          VITE_STRIPE_CUSTOMER_PORTAL_URL: ${{ vars.VITE_STRIPE_CUSTOMER_PORTAL_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
