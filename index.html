<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for Capacitor to fill the full screen
         including the notch / Dynamic Island / home indicator on iOS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/olia-app-icon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/olia-app-icon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/olia-app-icon-180.png" />

    <!-- Fonts — preconnect first, then stylesheet for fastest cross-browser load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Hanken+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />

    <title>Olia</title>
    <meta name="description" content="Olia — Your daily operations, streamlined." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Olia — Your daily operations, streamlined." />
    <meta property="og:description" content="Back-of-house operations software built exclusively for hospitality." />
    <meta property="og:image" content="/brand/social/olia-og-1200x630.png" />

    <!-- PWA / home screen meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Olia" />
    <meta name="theme-color" content="#15213E" />

    <!-- Prevent text size adjustment on orientation change -->
    <meta name="format-detection" content="telephone=no" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
